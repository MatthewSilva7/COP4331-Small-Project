<head>
    <meta charset="UTF-8">
    <title>Contact Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="css/login.css" rel="stylesheet"> 
    <script src="login.js"></script>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        
        <div id="loginDiv" class="card p-4 shadow-lg" style="width: 350px;">
            <h3 class="text-center mb-4">Login</h3>
            <div id="loginResult" class="text-danger text-center"></div> <input type="text" id="loginName" class="form-control mb-3" placeholder="Username">
            <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Password">
            
            <button type="button" class="btn btn-dark w-100" onclick="doLogin()">Sign In</button>
            
            <p class="mt-3 text-center">
                No account? <a href="#" onclick="showRegister()">Register here</a>
            </p>
        </div>

        <div id="registerDiv" class="card p-4 shadow-lg" style="width: 350px; display:none;">
            <h3 class="text-center mb-4">Register</h3>
            <div id="registerResult" class="text-danger text-center"></div>
            
            <input type="text" id="regFirstName" class="form-control mb-3" placeholder="First Name">
            <input type="text" id="regLastName" class="form-control mb-3" placeholder="Last Name">
            <input type="text" id="regLogin" class="form-control mb-3" placeholder="Username">
            <input type="password" id="regPassword" class="form-control mb-3" placeholder="Password">
            
            <button type="button" class="btn btn-success w-100" onclick="doRegister()">Sign Up</button>
            
            <p class="mt-3 text-center">
                Have an account? <a href="#" onclick="showLogin()">Login here</a>
            </p>
        </div>

    </div>

</body>
</html>
