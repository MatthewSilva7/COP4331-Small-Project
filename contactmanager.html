<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Contact Manager</h1>

  <div class="container">
    <div class="addcontact">
        <!-- Contact Form -->
        <h1 id="formTitle">Add contact</h1>

        <form id="contactForm">
            <input type="hidden" id="contactId">

            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone" required>
            <label class="checkbox-field" for="isFavorite">
                <input type="checkbox" id="isFavorite">
                <span>Mark as favorite</span>
            </label>

            <button type="submit">Save Contact</button>
        </form>
    </div>

    <div class="contacttable">
        <div class="toolbar" role="region" aria-label="Contact controls">
            <div class="toolbar-group">
                <label class="sr-only" for="searchInput">Search contacts</label>
                <input type="text" id="searchInput" placeholder="Search contacts..." aria-label="Search contacts" />
                <button type="button" id="clearSearchButton" class="secondary-button">Clear</button>
            </div>

            <div class="toolbar-group toolbar-group-sort">
                <label for="sortSelect">Sort by</label>
                <select id="sortSelect" aria-label="Sort contacts">
                    <option value="favorites">Favorites First</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>

            <label class="checkbox-field favorites-filter" for="favoritesOnly">
                <input type="checkbox" id="favoritesOnly">
                <span>Favorites only</span>
            </label>
        </div>

        <div id="resultsSummary" class="results-summary" aria-live="polite"></div>

        <!-- Contacts Table -->
        <table>
            <caption class="sr-only">Saved contacts</caption>
            <thead>
            <tr>
                <th>Favorite</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Date Created</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="contactTableBody"></tbody>
        </table>
    </div>


  </div>



  <script src="script.js"></script>
</body>
</html>
